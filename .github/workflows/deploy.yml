name: Deploy via FTP                    # Nama workflow
on:
  push:
    branches:
      - main                            # Trigger ketika push ke branch main

jobs:
  web-deploy:                           # Nama job
    name: Deploy to cPanel
    runs-on: ubuntu-latest              # Jalankan di server Ubuntu

    steps:
      - name: Get latest code
        uses: actions/checkout@v4       # Ambil kode dari repository

      - name: Sync files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4  # Action untuk upload via FTP
        with:
          server: ${{ secrets.FTP_SERVER }}         # Ambil dari secret
          username: ${{ secrets.FTP_USERNAME }}     # Ambil dari secret
          password: ${{ secrets.FTP_PASSWORD }}     # Ambil dari secret
          server-dir: ./                            # Upload ke direktori root